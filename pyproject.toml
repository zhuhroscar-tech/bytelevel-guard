[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytelevel-guard"
version = "0.1.4"
description = "Detect ByteLevel-BPE added-token decode corruption (the tokenizers#1996 bug class) in tokenizer.json/vocab.json before it ships."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "zhuhroscar-tech"}]
keywords = ["nlp", "tokenizer", "bpe", "huggingface", "machine-learning", "cli", "linting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/bytelevel-guard"
Issues = "https://github.com/zhuhroscar-tech/bytelevel-guard/issues"

[project.scripts]
bytelevel-guard = "bytelevel_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "tokenizers"]

[tool.setuptools.packages.find]
where = ["src"]
