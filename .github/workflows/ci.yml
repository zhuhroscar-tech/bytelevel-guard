name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps (including optional tokenizers)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -v --cov=bytelevel_guard --cov-report=term-missing
      - name: Smoke-test installed console script
        run: |
          bytelevel-guard --version
          bytelevel-guard --help
          bytelevel-guard explain
          set +e
          bytelevel-guard --no-color check-strings "kuća"
          risky_code=$?
          bytelevel-guard --no-color check-strings "hello"
          clean_code=$?
          set -e
          test "$risky_code" -eq 1
          test "$clean_code" -eq 0

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/bytelevel-guard --version
          set +e
          /tmp/smoke-venv/bin/bytelevel-guard --no-color check-strings "kuća"
          risky_code=$?
          set -e
          test "$risky_code" -eq 1
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
